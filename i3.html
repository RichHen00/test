<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>i3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Setting the background on html itself is the only reliable way to get
     the image to paint behind the iOS Safari address bar. The browser uses
     the html element's background to fill the area behind its own chrome. */
  html {
    height: 100%;
    background: #000 url('img/001.jpg') center/cover no-repeat fixed;
  }
  body {
    /* Body must be transparent so html's background shows through */
    background: transparent;
    min-height: 100%;
  }
  .label {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-size: 18px;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="label">2026-09-25 10:49:14</div>
</body>
</html>
