<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>i3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* html background paints into the iOS chrome area (behind address bar).
     background-attachment:fixed makes it use the same image tile/position
     as .bg so they appear seamless.                                       */
  html {
    background: url('img/001.jpg') center/cover no-repeat fixed;
  }
  body {
    background: transparent;
  }
  /* .bg covers the layout viewport (everything below the address bar).
     No filter, no extra color, nothing that creates a stacking context.  */
  .bg {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background-image: url('img/001.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  .label {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-size: 18px;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="label">2026-09-25 10:52:15</div>
</body>
</html>
